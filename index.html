<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資訊科技重補修</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Arial,"Noto Sans TC",sans-serif;background:#eef3f7;color:#172033}
.page{height:100%;display:grid;grid-template-columns:300px 1fr}
.sidebar{background:linear-gradient(180deg,#173b67,#24527a);color:#fff;padding:28px 18px;overflow:auto}
.brand{font-size:28px;font-weight:800;line-height:1.25;margin-bottom:8px}
.subtitle{font-size:14px;opacity:.85;margin-bottom:22px}
.unit-link{width:100%;display:block;text-align:left;border:0;background:rgba(255,255,255,.10);color:#fff;padding:15px 16px;border-radius:12px;margin:10px 0;font-size:16px;font-weight:700;cursor:pointer}
.unit-link:hover{background:rgba(255,255,255,.18)}
.unit-link.active{background:#fff;color:#173b67}
.hint{font-size:12px;opacity:.72;margin-top:18px;line-height:1.6}
.main{background:#fff;min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #dce4eb;background:#fff;font-weight:700}
.viewer{flex:1;min-height:0}
iframe{width:100%;height:100%;border:0;background:#fff}
.empty{height:100%;display:grid;place-items:center;text-align:center;padding:24px;color:#647487}
.empty .card{max-width:580px;border:1px solid #d9e2ea;border-radius:18px;padding:28px;background:#f8fafc}
.empty h2{color:#173b67;margin-top:0}
@media(max-width:800px){
  .page{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .sidebar{padding:16px}
  .unit-links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .unit-link{margin:0}
  .brand{font-size:22px}
  .hint{display:none}
}
</style>
</head>
<body>
<div class="page">
  <aside class="sidebar">
    <div class="brand">資訊科技重補修</div>
    <div class="subtitle">學習首頁</div>
    <div class="unit-links">
      <button class="unit-link active" data-file="01.html" data-title="單元一：我的數位生活安全嗎？">
        ① 單元一：我的數位生活安全嗎？
      </button>
      <button class="unit-link" data-file="02.html" data-title="單元二：排序法">
        ② 單元二：排序法
      </button>
      <button class="unit-link" data-file="03.html" data-title="單元三：二元樹走訪">
        ③ 單元三：二元樹走訪
      </button>
      <button class="unit-link" data-file="04.html" data-title="單元四：二元搜尋樹">
        ④ 單元四：二元搜尋樹
      </button>
    </div>
    <div class="hint">點選左側單元，內容會載入右方學習區。建議將 01.html、02.html 與本首頁放在同一個資料夾。</div>
  </aside>

  <main class="main">
    <div class="topbar" id="currentTitle">單元一：我的數位生活安全嗎？</div>
    <div class="viewer" id="viewer">
      <iframe id="unitFrame" src="01.html" title="資訊科技重補修學習內容"></iframe>
    </div>
  </main>
</div>

<script>
(function(){
  const buttons = document.querySelectorAll(".unit-link");
  const frame = document.getElementById("unitFrame");
  const title = document.getElementById("currentTitle");

  buttons.forEach(function(btn){
    btn.addEventListener("click",function(){
      buttons.forEach(function(b){b.classList.remove("active")});
      btn.classList.add("active");

      frame.src = btn.dataset.file;
      title.textContent = btn.dataset.title;

      frame.setAttribute("title", btn.dataset.title);
    });
  });
})();
</script>
</body>
</html>
